project:
  name: "Knowledge-Driven IoT Fault Diagnosis Assistant"
  device_id: "MOTOR-001"
  telemetry_interval_seconds: 5

mqtt:
  topics:
    telemetry: "factory/iot/telemetry"
    status: "factory/iot/status"
    anomaly: "factory/iot/anomaly"
    diagnosis: "factory/iot/diagnosis"

database:
  path: "database/app.db"

ml:
  algorithm: "isolation_forest"
  contamination: 0.05
  random_state: 42
  model_path: "models/isolation_forest.joblib"

rag:
  manuals_dir: "data/manuals"
  vector_store_path: "rag_store"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 400
  chunk_overlap: 50
  retrieval_top_k: 3
  low_confidence_threshold: 0.35

llm:
  timeout_seconds: 120
  temperature: 0.1

dashboard:
  title: "Factory Fault Diagnosis Assistant"
  refresh_seconds: 10

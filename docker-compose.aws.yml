# AWS override: layered on top of docker-compose.yml on the EC2 host.
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d
#
# Differences from local dev:
#   - the image is pulled from ECR (IMAGE_URI) instead of built on the host;
#   - there is no Ollama on the host, so one runs as a container here and the
#     llama model is pulled into a named volume on first start.
services:
  app:
    image: ${IMAGE_URI:?set IMAGE_URI to the ECR image, e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com/iot-fault-assistant:latest}
    pull_policy: always
    environment:
      OLLAMA_HOST: http://ollama:11434

  subscriber:
    image: ${IMAGE_URI:?set IMAGE_URI}
    pull_policy: always
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  publisher:
    image: ${IMAGE_URI:?set IMAGE_URI}
    pull_policy: always
    depends_on:
      - subscriber

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: downloads the model (~2 GB) once, then exits. Later starts are no-ops.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_models:

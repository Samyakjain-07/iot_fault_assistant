# app, subscriber and publisher are one image run three ways; `docker compose up`
# starts the whole pipeline (simulated motor -> EMQX Cloud -> SQLite) plus the
# two dashboards: Streamlit on :8502, Grafana on :3000 (admin / admin).
x-python-service: &python-service
  build: .
  image: iot-fault-assistant:latest
  env_file:
    - .env
  environment:
    # .env says localhost, which inside a container is the container itself.
    # Ollama runs on the host, so reach it through the host gateway.
    OLLAMA_HOST: http://host.docker.internal:11434
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # The trained model, vector store and embedding model are baked into the
  # image (see Dockerfile); only the SQLite file is shared between services.
  volumes:
    - ./database:/app/database

services:
  app:
    <<: *python-service
    ports:
      # Set APP_PORT in .env or the shell to publish it on a different host port.
      - "${APP_PORT:-8502}:8502"
    healthcheck:
      # python:slim has no curl, so probe Streamlit's health endpoint with Python.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8502/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  subscriber:
    <<: *python-service
    command: ["python", "-m", "src.mqtt_subscriber"]
    restart: unless-stopped

  # Demo data: healthy readings, then a short high-temperature fault so there
  # are anomalies to diagnose. Edit the flags (see scripts/generate_telemetry.py)
  # to inject a different fault, or drop them for healthy readings only.
  publisher:
    <<: *python-service
    command:
      - python
      - scripts/generate_telemetry.py
      - --fault=high_temperature
      - --fault-after=20
      - --fault-count=10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./database:/var/lib/grafana-sqlite-source
    environment:
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/motor_telemetry.json
      # Defaults to admin/admin for local use; set GRAFANA_ADMIN_PASSWORD in the
      # environment (or .env) on any host that is reachable from the internet.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    restart: unless-stopped
    depends_on:
      - app
